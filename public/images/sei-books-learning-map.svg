<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SEI architecture books learning map</title>
  <desc id="desc">A visual learning map connecting Software Architecture in Practice and Documenting Software Architectures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#e2e8f0" stroke-width="1">
    <path d="M100 110h1080M100 230h1080M100 350h1080M100 470h1080M100 590h1080"/>
    <path d="M180 70v580M380 70v580M580 70v580M780 70v580M980 70v580M1180 70v580"/>
  </g>
  <text x="640" y="72" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">SEI Software Architecture Books: Learning Map</text>
  <text x="640" y="112" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#cbd5e1">설계·평가·문서화를 하나의 피드백 루프로 연결하기</text>

  <g filter="url(#shadow)">
    <rect x="90" y="185" width="350" height="310" rx="28" fill="url(#bookA)"/>
    <rect x="840" y="185" width="350" height="310" rx="28" fill="url(#bookB)"/>
  </g>

  <text x="265" y="238" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="white">Software Architecture</text>
  <text x="265" y="270" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="white">in Practice 4/e</text>
  <text x="265" y="314" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#dbeafe">무엇을 설계하고 평가할 것인가?</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#eff6ff">
    <text x="130" y="364">• Quality Attribute Scenario</text>
    <text x="130" y="396">• Tactic / Pattern / Trade-off</text>
    <text x="130" y="428">• ATAM / Architecture Debt</text>
    <text x="130" y="460">• Architecturally Significant Requirement</text>
  </g>

  <text x="1015" y="238" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="white">Documenting Software</text>
  <text x="1015" y="270" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="white">Architectures 2/e</text>
  <text x="1015" y="314" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#dcfce7">누구에게 어떤 view로 설명할 것인가?</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#ecfdf5">
    <text x="880" y="364">• Module / C&amp;C / Allocation View</text>
    <text x="880" y="396">• Viewtype / Style / View Packet</text>
    <text x="880" y="428">• Context / Interface / Behavior</text>
    <text x="880" y="460">• Review Checklist / Rationale</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="205" width="292" height="270" rx="26" fill="#111827" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="640" y="250" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#f8fafc">실무 통합 루프</text>
    <circle cx="640" cy="325" r="58" fill="#f59e0b" opacity="0.95"/>
    <text x="640" y="318" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#111827">Design</text>
    <text x="640" y="342" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#111827">Decision</text>
    <text x="640" y="412" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#cbd5e1">ASR → 설계 → 평가 → 문서화</text>
    <text x="640" y="438" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#cbd5e1">→ 리뷰 → 피드백</text>
  </g>

  <path d="M442 340 C505 310, 560 300, 590 315" fill="none" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M690 315 C730 300, 785 310, 838 340" fill="none" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M840 470 C740 585, 540 585, 440 470" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="640" y="600" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">요약: SAiP는 의사결정의 내용, DSA는 의사결정의 전달 형식을 제공한다.</text>
</svg>
