<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Views and beyond view types</title>
  <desc id="desc">Module, component-and-connector, and allocation views with beyond-view information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#334155" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="800" fill="#0f172a">Views and Beyond 한 장 요약</text>
  <text x="600" y="100" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#475569">하나의 아키텍처를 여러 stakeholder concern(이해관계자 관심사)에 맞춰 분해한다</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="300" height="250" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <rect x="450" y="160" width="300" height="250" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="830" y="160" width="300" height="250" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <text x="220" y="210" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#1e3a8a">Module View</text>
  <text x="220" y="244" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#1e40af">정적 코드/책임 구조</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#0f172a">
    <text x="105" y="300">• Decomposition(분해)</text>
    <text x="105" y="332">• Uses(사용)</text>
    <text x="105" y="364">• Layered(계층)</text>
  </g>

  <text x="600" y="210" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14532d">C&amp;C View</text>
  <text x="600" y="244" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#166534">런타임 상호작용 구조</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#0f172a">
    <text x="485" y="300">• Component(컴포넌트)</text>
    <text x="485" y="332">• Connector(커넥터)</text>
    <text x="485" y="364">• Protocol(프로토콜)</text>
  </g>

  <text x="980" y="210" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#92400e">Allocation View</text>
  <text x="980" y="244" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#92400e">환경/조직으로의 매핑</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#0f172a">
    <text x="865" y="300">• Deployment(배포)</text>
    <text x="865" y="332">• Install(설치)</text>
    <text x="865" y="364">• Work Assignment(작업 할당)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="205" y="470" width="790" height="86" rx="22" fill="#0f172a"/>
  </g>
  <text x="600" y="505" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Beyond Views</text>
  <text x="600" y="535" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#cbd5e1">Context Diagram · Interface · Behavior · Variability · Rationale · View Mapping</text>
  <path d="M220 410 C280 450, 360 470, 465 495" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M600 410 L600 470" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M980 410 C920 450, 840 470, 735 495" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
